<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A cinematic birthday story for my favourite human.">
  <title>For My Favourite Human ❤️</title>

  <!-- Google Fonts: Cormorant Garamond, Inter, Dancing Script with robust fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       DESIGN SYSTEM & CSS VARIABLES
       ========================================================================== */
    :root {
      --wine: #4A1830;
      --burgundy: #681F3A;
      --rose: #C96A82;
      --blush: #F3C6CF;
      --cream: #FFF7F1;
      --champagne: #E8CFA5;
      --night: #160D18;
      --white: #FFFFFF;

      --font-serif: 'Cormorant Garamond', Playfair Display, Georgia, serif;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-script: 'Dancing Script', cursive;

      --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-soft: cubic-bezier(0.25, 0.1, 0.25, 1);
      --anim-duration: 800ms;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-sans);
      background-color: var(--night);
      color: var(--cream);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 1.2s var(--ease-soft), color 1s ease;
      position: relative;
    }

    /* THEME SYSTEM */
    body.theme-night {
      background: radial-gradient(circle at 50% 20%, #251329 0%, var(--night) 70%, #0a040b 100%);
      color: var(--cream);
    }
    body.theme-warm {
      background: radial-gradient(circle at 50% 30%, #5d1933 0%, var(--burgundy) 50%, var(--wine) 100%);
      color: var(--cream);
    }
    body.theme-paper {
      background: radial-gradient(circle at 50% 25%, #FFFDF9 0%, var(--cream) 60%, var(--blush) 100%);
      color: var(--wine);
    }
    body.theme-blush {
      background: radial-gradient(circle at 50% 20%, #fae1e7 0%, var(--blush) 50%, #d88fa2 100%);
      color: var(--wine);
    }
    body.theme-festive {
      background: radial-gradient(circle at 50% 30%, #3d142b 0%, #220b1a 60%, #11050e 100%);
      color: var(--cream);
    }
    body.theme-black {
      background: #09040a;
      color: var(--cream);
    }

    /* SVG GRAIN OVERLAY */
    .grain-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.045;
      pointer-events: none;
      z-index: 100;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* FLOATING PARTICLES (HEARTS & STARS) */
    .floating-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .floater {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
      animation: floatUp 8s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105dvh) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.55;
      }
      80% {
        opacity: 0.55;
      }
      100% {
        transform: translateY(-10dvh) scale(1.1) rotate(25deg);
        opacity: 0;
      }
    }

    /* TOP PROGRESS BAR */
    .progress-bar-container {
      position: fixed;
      top: calc(var(--safe-top) + 8px);
      left: 24px;
      right: 24px;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      z-index: 50;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.6s ease;
      backdrop-filter: blur(4px);
    }
    .progress-bar-container.visible {
      opacity: 1;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--champagne), var(--rose));
      border-radius: 4px;
      transition: width 0.6s var(--ease-cinematic);
    }

    /* AUDIO TOGGLE BUTTON */
    .audio-btn {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      right: calc(var(--safe-right) + 16px);
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      background: rgba(22, 13, 24, 0.4);
      border: 1px solid rgba(232, 207, 165, 0.35);
      backdrop-filter: blur(10px);
      color: var(--champagne);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 90;
      transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
      font-size: 1.1rem;
    }
    .audio-btn:hover {
      transform: scale(1.08);
      background: rgba(104, 31, 58, 0.6);
      border-color: var(--champagne);
    }
    .audio-btn:focus-visible {
      outline: 2px solid var(--champagne);
      outline-offset: 2px;
    }

    /* MAIN STAGE */
    main#stage {
      position: relative;
      width: 100%;
      max-width: 680px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(var(--safe-top) + 32px) calc(var(--safe-left) + 20px) calc(var(--safe-bottom) + 32px) calc(var(--safe-right) + 20px);
      text-align: center;
      z-index: 10;
      cursor: pointer; /* Tap anywhere to advance line */
    }

    .scene-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      transition: opacity var(--anim-duration) var(--ease-soft), transform var(--anim-duration) var(--ease-cinematic);
      will-change: opacity, transform;
    }
    .scene-content.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .scene-content.exit {
      opacity: 0;
      transform: translateY(-16px) scale(0.98);
    }

    /* TYPOGRAPHY */
    .scene-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5.5vw, 3.2rem);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
      margin-bottom: 1.2rem;
      color: var(--champagne);
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }
    body.theme-paper .scene-title, body.theme-blush .scene-title {
      color: var(--burgundy);
      text-shadow: none;
    }

    .scene-text-block {
      max-width: clamp(32ch, 85vw, 56ch);
      font-size: clamp(1.05rem, 3.5vw, 1.3rem);
      line-height: 1.7;
      font-weight: 300;
      margin-bottom: 1.5rem;
    }

    .line-item {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.7s var(--ease-soft), transform 0.7s var(--ease-cinematic);
      margin-bottom: 0.9rem;
      will-change: opacity, transform;
    }
    .line-item.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .script-accent {
      font-family: var(--font-script);
      font-size: 1.4em;
      color: var(--champagne);
      display: inline-block;
      margin: 0 4px;
      font-weight: 600;
    }
    body.theme-paper .script-accent, body.theme-blush .script-accent {
      color: var(--burgundy);
    }

    .large-statement {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      font-weight: 600;
      font-style: italic;
      color: var(--champagne);
      line-height: 1.35;
      margin: 1.5rem 0;
      text-shadow: 0 0 25px rgba(232, 207, 165, 0.4);
    }
    body.theme-paper .large-statement, body.theme-blush .large-statement {
      color: var(--wine);
      text-shadow: none;
    }

    /* BUTTONS / CTAS */
    .cta-container {
      margin-top: 1.6rem;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.6s ease 0.2s, transform 0.6s var(--ease-cinematic) 0.2s;
      pointer-events: none;
    }
    .cta-container.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .btn-pill {
      min-height: 50px;
      min-width: 170px;
      padding: 13px 32px;
      font-family: var(--font-sans);
      font-size: clamp(0.95rem, 2.8vw, 1.05rem);
      font-weight: 500;
      letter-spacing: 0.04em;
      border-radius: 9999px;
      border: 1px solid var(--champagne);
      background: linear-gradient(135deg, rgba(232, 207, 165, 0.2) 0%, rgba(104, 31, 58, 0.6) 100%);
      color: var(--cream);
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(22, 13, 24, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: transform 0.3s var(--ease-soft), box-shadow 0.3s ease, background 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-pill:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 36px rgba(201, 106, 130, 0.35), 0 0 20px rgba(232, 207, 165, 0.4);
      background: linear-gradient(135deg, rgba(232, 207, 165, 0.35) 0%, rgba(104, 31, 58, 0.8) 100%);
    }
    .btn-pill:active {
      transform: translateY(1px) scale(0.98);
    }
    .btn-pill:focus-visible {
      outline: 2px solid var(--champagne);
      outline-offset: 3px;
    }

    .pulse-cta {
      animation: ctaPulse 2.4s infinite ease-in-out;
    }
    @keyframes ctaPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 8px 30px rgba(201, 106, 130, 0.3);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 10px 40px rgba(232, 207, 165, 0.5);
      }
    }

    body.theme-paper .btn-pill, body.theme-blush .btn-pill {
      background: linear-gradient(135deg, var(--burgundy) 0%, var(--wine) 100%);
      color: var(--cream);
      border-color: var(--wine);
      box-shadow: 0 8px 24px rgba(104, 31, 58, 0.25);
    }
    body.theme-paper .btn-pill:hover, body.theme-blush .btn-pill:hover {
      box-shadow: 0 10px 30px rgba(104, 31, 58, 0.4);
    }

    /* GLASS CARDS & CONTAINERS */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(232, 207, 165, 0.25);
      border-radius: 20px;
      padding: clamp(20px, 5vw, 36px);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }
    body.theme-paper .glass-card {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(104, 31, 58, 0.15);
      box-shadow: 0 16px 36px rgba(104, 31, 58, 0.08);
    }
    body.theme-blush .glass-card {
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(201, 106, 130, 0.25);
      box-shadow: 0 16px 36px rgba(104, 31, 58, 0.1);
    }

    /* SCENE 1: HEART SCANNER */
    .heart-scanner {
      width: 90px;
      height: 90px;
      margin: 0 auto 1.5rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .heart-svg-main {
      width: 70px;
      height: 70px;
      fill: var(--rose);
      filter: drop-shadow(0 0 15px rgba(201, 106, 130, 0.8));
      animation: heartbeat 1.5s infinite var(--ease-soft);
      transition: transform 0.5s ease;
    }
    .heart-scanner:hover .heart-svg-main {
      transform: scale(1.15);
      filter: drop-shadow(0 0 25px var(--champagne));
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.18); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }

    /* SCENE 2: WARNING ICON */
    .warning-icon {
      font-size: 2.8rem;
      display: inline-block;
      margin-bottom: 0.8rem;
      animation: gentleShake 2.5s infinite ease-in-out;
    }
    @keyframes gentleShake {
      0%, 80%, 100% { transform: rotate(0deg); }
      85% { transform: rotate(-8deg); }
      90% { transform: rotate(8deg); }
      95% { transform: rotate(-5deg); }
    }

    /* SCENE 3: ENVELOPE */
    .envelope-box {
      width: 120px;
      height: 80px;
      background: var(--champagne);
      border-radius: 8px;
      position: relative;
      margin: 0 auto 1.8rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(104, 31, 58, 0.2);
    }
    .envelope-box::before {
      content: '💌';
      font-size: 2.2rem;
      animation: gentleFloat 3s infinite ease-in-out;
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* SCENE 10: LONG DISTANCE ANIMATION */
    .distance-visual {
      width: 100%;
      max-width: 320px;
      height: 70px;
      margin: 1.5rem auto;
      position: relative;
    }
    .distance-svg {
      width: 100%;
      height: 100%;
    }
    .pulse-dot {
      animation: dotGlow 2s infinite ease-in-out;
    }
    @keyframes dotGlow {
      0%, 100% { r: 5; opacity: 0.8; filter: drop-shadow(0 0 6px var(--champagne)); }
      50% { r: 8; opacity: 1; filter: drop-shadow(0 0 14px var(--rose)); }
    }

    /* SCENE 15: POLICE BADGE */
    .police-badge-card {
      border: 2px dashed var(--burgundy);
      background: rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      padding: 20px;
      margin: 1rem auto;
      max-width: 440px;
      position: relative;
      color: var(--wine);
    }
    .police-header {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 1.05rem;
      color: var(--burgundy);
      margin-bottom: 12px;
    }

    /* SCENE 16: LEGAL AGREEMENT */
    .legal-doc {
      text-align: left;
      font-family: var(--font-serif);
      background: #FFFDF9;
      color: var(--wine);
      border: 1px solid rgba(104, 31, 58, 0.2);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 460px;
      margin: 1rem auto;
    }
    .legal-doc h3 {
      font-size: 1.25rem;
      text-align: center;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(104, 31, 58, 0.15);
      padding-bottom: 8px;
    }
    .check-list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      font-size: 1rem;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .check-list-item.checked {
      opacity: 1;
      transform: translateX(0);
    }
    .check-icon {
      color: #2e7d32;
      font-weight: bold;
    }

    /* SCENE 17: BRAIN VS HEART */
    .split-reaction-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 1.5rem auto;
      width: 100%;
      max-width: 480px;
    }
    @media (max-width: 420px) {
      .split-reaction-box {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }
    .reaction-card {
      padding: 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(104, 31, 58, 0.15);
      font-size: 0.95rem;
      color: var(--wine);
      text-align: center;
    }
    .reaction-label {
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: var(--burgundy);
    }

    /* SCENE 20: RUBBER STAMP */
    .stamp-badge {
      display: inline-block;
      border: 3px solid #d32f2f;
      color: #d32f2f;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.12em;
      padding: 8px 24px;
      border-radius: 8px;
      margin-top: 1.5rem;
      transform: rotate(-10deg) scale(2);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
    }
    .stamp-badge.stamped {
      transform: rotate(-8deg) scale(1);
      opacity: 1;
    }

    /* SCENE 22-26: BIRTHDAY CAKE & FLAME & CAT */
    .celebration-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0.2rem auto;
    }

    .cake-wrapper {
      position: relative;
      width: clamp(210px, 62vw, 240px);
      height: clamp(155px, 46vw, 180px);
      margin: 4px auto 8px;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .cake-wrapper.popped {
      transform: scale(1.1);
    }

    .candle-flame {
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      height: 25px;
      background: radial-gradient(circle, #fff, #ffd54f 60%, #ff6d00 100%);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 18px #ffb300, 0 0 32px #ff6f00;
      animation: flicker 1.2s infinite alternate ease-in-out;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform-origin: bottom center;
    }
    .candle-flame.blown-out {
      opacity: 0;
      transform: translateX(-50%) scale(0.2) translateY(-10px);
    }
    @keyframes flicker {
      0%, 100% { transform: translateX(-50%) rotate(-2deg) scale(1); }
      50% { transform: translateX(-50%) rotate(2deg) scale(1.08); }
    }

    .smoke-puff {
      position: absolute;
      top: -18px;
      left: 50%;
      width: 12px;
      height: 12px;
      background: rgba(200, 200, 200, 0.6);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }
    .smoke-puff.rise {
      animation: smokeRise 1.6s forwards ease-out;
    }
    @keyframes smokeRise {
      0% { opacity: 0.8; transform: translate(-50%, 0) scale(0.6); }
      100% { opacity: 0; transform: translate(-50%, -40px) scale(2.4); }
    }

    .countdown-overlay {
      position: absolute;
      font-size: clamp(3.5rem, 10vw, 5rem);
      font-family: var(--font-serif);
      font-weight: 700;
      color: var(--champagne);
      text-shadow: 0 0 30px var(--rose);
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.3s ease, transform 0.3s var(--ease-cinematic);
      pointer-events: none;
      z-index: 30;
    }
    .countdown-overlay.show {
      opacity: 1;
      transform: scale(1.2);
    }

    /* CAT SVG ANIMATIONS */
    .cat-container {
      width: 120px;
      height: 98px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cat-tail {
      transform-origin: 30px 90px;
      animation: tailWag 3.2s infinite ease-in-out;
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(16deg); }
    }
    .cat-eye {
      transform-origin: center;
      animation: eyeBlink 4.5s infinite ease;
    }
    @keyframes eyeBlink {
      0%, 94%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .cat-paw-wave {
      transform-origin: 84px 74px;
      animation: pawWave 1.2s infinite ease-in-out;
    }
    @keyframes pawWave {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(20deg); }
    }

    /* CONFETTI CANVAS */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }

    /* TAP PROMPT / SUBTLE HINT */
    .tap-hint {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 12px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      opacity: 0.45;
      color: var(--champagne);
      pointer-events: none;
      transition: opacity 0.4s ease;
      font-weight: 300;
      z-index: 20;
    }
    body.theme-paper .tap-hint, body.theme-blush .tap-hint {
      color: var(--wine);
      opacity: 0.55;
    }

    /* PREFERS REDUCED MOTION */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {

    emotional.muted = false;

    emotional.preload = 'auto';
    emotional.addEventListener('error', () => { emotional._error = true; });

    const birthday = new Audio('assets/audio/birthday.mp3');
    birthday.loop = true;

    let audioCtx = null;
    let synthMasterGain = null;
    let emotionalLoopTimer = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          synthMasterGain = audioCtx.createGain();
          synthMasterGain.gain.setValueAtTime(isMuted ? 0 : 0.32, audioCtx.currentTime);
          synthMasterGain.connect(audioCtx.destination);
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    // Play a gentle music-box / Rhodes chime note
    function playChime(freq, time, duration = 1.4, vol = 0.3) {
      if (!audioCtx || !synthMasterGain || isMuted) return;
      try {
        const osc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const noteGain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, time);

        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(freq * 2, time); // warm overtone

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1400, time);
        filter.frequency.exponentialRampToValueAtTime(400, time + duration);

        noteGain.gain.setValueAtTime(0.001, time);
        noteGain.gain.linearRampToValueAtTime(vol, time + 0.02);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

        osc.connect(filter);
        osc2.connect(filter);
        filter.connect(noteGain);
        noteGain.connect(synthMasterGain);

        osc.start(time);
        osc2.start(time);
        osc.stop(time + duration);
        osc2.stop(time + duration);
      } catch (e) {}
    }

      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77, C6: 1046.50

    // Emotional chord progression sequence (Cmaj9 → Am9 → Fmaj7 → Gsus4/G)

      // Cmaj9
      { f: N.C3, d: 0.0, v: 0.35 }, { f: N.G3, d: 0.4, v: 0.25 }, { f: N.E4, d: 0.8, v: 0.28 }, { f: N.B4, d: 1.2, v: 0.32 }, { f: N.D5, d: 1.6, v: 0.30 }, { f: N.G4, d: 2.0, v: 0.24 },
      // Am9
      { f: N.A3, d: 2.6, v: 0.35 }, { f: N.E4, d: 3.0, v: 0.25 }, { f: N.C4, d: 3.4, v: 0.28 }, { f: N.G4, d: 3.8, v: 0.32 }, { f: N.B4, d: 4.2, v: 0.30 }, { f: N.E5, d: 4.6, v: 0.26 },

        const now = audioCtx.currentTime + 0.05;

            emotional.pause();
            emotional.currentTime = 0;
            emotional.volume = 0.5;
          }

      }

      }

    /* ==========================================================================
       CONFETTI SYSTEM
       ========================================================================== */
    class ConfettiEngine {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.pieces = [];
        this.running = false;
        this.resize();
        window.addEventListener('resize', () => this.resize());
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      start(count = 55) {
        this.pieces = [];
        const colors = ['#E8CFA5', '#C96A82', '#F3C6CF', '#FFF7F1', '#FFD54F'];
        for (let i = 0; i < count; i++) {
          this.pieces.push({
            x: Math.random() * this.canvas.width,
            y: Math.random() * -this.canvas.height * 0.5,
            size: 5 + Math.random() * 7,
            color: colors[Math.floor(Math.random() * colors.length)],
            speedY: 2 + Math.random() * 3.5,
            speedX: (Math.random() - 0.5) * 2,
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 6,
            opacity: 1
          });
        }
        this.running = true;
        this.animate();
        setTimeout(() => this.stop(), 5500);
      }

      stop() {
        this.running = false;
        if (this.ctx) this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      }

      animate() {
        if (!this.running) return;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        let activePieces = 0;

        for (let p of this.pieces) {
          p.y += p.speedY;
          p.x += p.speedX;
          p.rotation += p.rotSpeed;

          if (p.y > this.canvas.height * 0.75) {
            p.opacity -= 0.015;
          }

          if (p.opacity > 0 && p.y < this.canvas.height) {
            activePieces++;
            this.ctx.save();
            this.ctx.translate(p.x, p.y);
            this.ctx.rotate((p.rotation * Math.PI) / 180);
            this.ctx.fillStyle = p.color;
            this.ctx.globalAlpha = Math.max(0, p.opacity);
            this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
            this.ctx.restore();
          }
        }

        if (activePieces > 0 && this.running) {
          requestAnimationFrame(() => this.animate());
        } else {
          this.stop();
        }
      }
    }

          this.handleScreenTap();
        });

        // Keyboard navigation support
        document.addEventListener('keydown', (e) => {
          if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') {
            if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
            e.preventDefault();
            this.handleScreenTap();
          }
        });
      }

      init() {
        this.renderScene(0);
      }

      updateProgressBar() {
        if (this.currentIndex === 0 || this.currentIndex === this.scenes.length - 1) {
          this.progressBar.classList.remove('visible');
        } else {
          this.progressBar.classList.add('visible');
          const pct = ((this.currentIndex) / (this.scenes.length - 1)) * 100;
          this.progressFill.style.width = `${pct}%`;
        }
      }

      clearTimers() {
        this.lineTimeouts.forEach(t => clearTimeout(t));
        this.lineTimeouts = [];
      }

      renderScene(index) {
        this.clearTimers();
        this.currentIndex = index;
        const scene = this.scenes[index];
        this.currentLineIndex = 0;
        this.allLinesRevealed = false;

        // Body theme update
        document.body.className = scene.theme;
        this.updateProgressBar();

        // Crossfade animation
        this.container.classList.remove('active');
        this.container.classList.add('exit');

        setTimeout(() => {
          this.buildSceneDOM(scene);
          this.container.classList.remove('exit');
          this.container.classList.add('active');

          if (scene.onEnter) scene.onEnter();
          this.revealLinesSequentially(scene);
        }, 350);
      }

      buildSceneDOM(scene) {
        let html = '';
        if (scene.customHtmlTop) html += scene.customHtmlTop;

        const isCard = scene.card;
        if (isCard) html += `<div class="glass-card">`;

        html += `<div class="scene-text-block">`;
        if (scene.lines) {
          scene.lines.forEach((line, i) => {
            html += `<div class="line-item" id="line-${i}">${line}</div>`;
          });
        }
        if (scene.customHtmlMiddle) {
          html += scene.customHtmlMiddle;
        }
        if (scene.linesAfter) {
          const offset = scene.lines ? scene.lines.length : 0;
          scene.linesAfter.forEach((line, i) => {
            html += `<div class="line-item" id="line-${offset + i}">${line}</div>`;
          });
        }
        html += `</div>`;

        if (isCard) html += `</div>`;

        if (scene.cta) {
          const pulseClass = scene.pulseCta ? 'pulse-cta' : '';
          html += `
            <div class="cta-container" id="sceneCtaContainer">
              <button class="btn-pill ${pulseClass}" id="sceneCtaBtn">${scene.cta}</button>
            </div>
          `;
        }

        this.container.innerHTML = html;

        // Bind CTA
        const ctaBtn = document.getElementById('sceneCtaBtn');
        if (ctaBtn) {
          ctaBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (this.currentIndex === 0) {
              playEmotional();
            }
            if (scene.customCtaHandler) {
              scene.customCtaHandler();
            } else {
              this.nextScene();
            }
          });
        }

        // Special scene 1 heart click
        const scanner = document.getElementById('openScanner');
        if (scanner) {
          scanner.addEventListener('click', (e) => {
            e.stopPropagation();
            playEmotional();
            this.nextScene();
          });
        }
      }

      revealLinesSequentially(scene) {
        const allItems = this.container.querySelectorAll('.line-item');
        if (allItems.length === 0) {
          this.showCta();
          return;
        }

        let cumDelay = 200;
        const delays = (scene.delays || []).concat(scene.delaysAfter || []);

        allItems.forEach((el, idx) => {
          const wait = delays[idx] || 1000;
          cumDelay += wait;
          const t = setTimeout(() => {
            el.classList.add('revealed');
            this.currentLineIndex = idx + 1;
            if (idx === allItems.length - 1) {
              this.showCta();
            }
          }, cumDelay);
          this.lineTimeouts.push(t);
        });
      }

      handleScreenTap() {
        // Retry audio play if previously blocked
        if (!emotionalStarted && this.currentIndex < 21) {
          playEmotional();
        }

        const allItems = this.container.querySelectorAll('.line-item');
        if (!this.allLinesRevealed && allItems.length > 0) {
          // Fast reveal all remaining lines instantly
          this.clearTimers();
          allItems.forEach(el => el.classList.add('revealed'));
          this.showCta();
        } else {
          // If all revealed, advance if CTA is available and simple
          const scene = this.scenes[this.currentIndex];
          if (scene && scene.cta && !scene.customCtaHandler) {
            this.nextScene();
          }
        }
      }

      showCta() {
        this.allLinesRevealed = true;
        const cta = document.getElementById('sceneCtaContainer');
        if (cta) cta.classList.add('visible');
      }

      nextScene() {
        if (this.currentIndex < this.scenes.length - 1) {
          this.renderScene(this.currentIndex + 1);
        }
      }

      goToScene(index) {
        this.renderScene(index);
      }
    }

    const sceneEngine = new SceneEngine(scenes);
    sceneEngine.init();

    /* ==========================================================================
       AUDIO BUTTON EVENT LISTENER
       ========================================================================== */
    const audioBtn = document.getElementById('audioToggleBtn');
    const audioIcon = document.getElementById('audioIcon');

    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const muted = toggleMute();
      audioBtn.setAttribute('aria-pressed', String(!muted));
      audioIcon.textContent = muted ? '🔇' : '🔊';
    });
  </script>
</body>
</html>
